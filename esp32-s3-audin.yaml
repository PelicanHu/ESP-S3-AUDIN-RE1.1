
substitutions:
  name: esp32-s3-audin
  friendly_name: "ESP32 S3-AUDIN Voice"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2025.2.0
  on_boot:
    priority: -100
    then:
      - wait_until:
          api.connected:
      - delay: 1s
      - lambda: |-
          if (id(mic_alc).state) {
            id(es8388_registers).write_byte(0x12, 0xE2);
          } else {
            id(es8388_registers).write_byte(0x12, 0x22);
          }     
          uint8_t reg_value = 0x00;
          switch ((int) id(mic_gain_control).state) {
            case 12: reg_value = 0x44; break;
            case 15: reg_value = 0x55; break;
            case 18: reg_value = 0x66; break;
            case 21: reg_value = 0x77; break;
            case 24: reg_value = 0x88; break;
          }
          id(es8388_registers).write_byte(0x09, reg_value);          
      - micro_wake_word.start:

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

logger:
  level: DEBUG

output:
  - platform: gpio
    pin: GPIO21
    id: status_led

api:
  encryption:
    key: !secret esp32_s3_audin__encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  use_address: 192.168.0.21
  ap:
    ssid: "${name} Fallback"
    password: "12345678"

captive_portal:

i2c:
  id: codec_i2c
  sda: 14
  scl: 47
  frequency: 100kHz
  scan: true

i2c_device:
  - id: es8388_registers
    i2c_id: codec_i2c
    address: 0x10  

audio_dac:
  - platform: es8388
    id: es8388_dac
    i2c_id: codec_i2c
    address: 0x10
    mic_gain: 21DB

select:
  - platform: es8388
    es8388_id: es8388_dac
    dac_output:
      name: "DAC out"
      initial_option: BOTH
    adc_input_mic:
      name: "ADC mic in"
      initial_option: LINE1

i2s_audio:
  id: i2s_bus
  i2s_lrclk_pin: 9
  i2s_bclk_pin: 3
  i2s_mclk_pin: 8
  full_duplex: true

speaker:
  - platform: i2s_audio
    id: voice_speaker
    i2s_audio_id: i2s_bus
    i2s_dout_pin: 46
    dac_type: external
    audio_dac: es8388_dac
    channel: mono
    sample_rate: 16000
    bits_per_sample: 16bit
    buffer_duration: 500ms
    timeout: 500ms

globals:
  - id: voice_volume
    type: float
    restore_value: yes
    initial_value: "0.8"

voice_assistant:
  id: assist
  microphone: voice_microphone
  speaker: voice_speaker
  use_wake_word: false
  volume_multiplier: 0.7
  on_listening:
    - logger.log: "Assist: listening"
    - output.turn_on: status_led
  on_stt_vad_start:
    - logger.log: "Assist: speech sensed"
  on_stt_vad_end:
    - logger.log: "Assist: speech end"
  on_stt_end:
    - logger.log: "Assist: recognition finished"
    - output.turn_off: status_led
  on_tts_start:
    - logger.log: "Assist: play respond"
  on_end:
    - logger.log: "Assist: end"
    - output.turn_off: status_led
    - wait_until:
        not:
          voice_assistant.is_running
    - micro_wake_word.start:
  on_error:
    - logger.log:
        format: "Voice Assistant err: %s"
        args: ["code.c_str()"]
    - output.turn_off: status_led
    - micro_wake_word.start:
      
microphone:
  - platform: i2s_audio
    id: voice_microphone
    i2s_audio_id: i2s_bus
    i2s_din_pin: 10
    adc_type: external
    pdm: false
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: left

micro_wake_word:
  microphone:
    microphone: voice_microphone
    channels: 0
    gain_factor: 4
  models:
    - model: alexa
      id: alexa
#    - model: hey_jarvis
#      id: hey_jarvis
#    - model: okay_nabu
#      id: okay_nabu
  on_wake_word_detected:
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

button:
  - platform: template
    name: "Start voice assist"
    on_press:
      - if:
          condition:
            not:
              voice_assistant.is_running
          then:
            - voice_assistant.start:

number:
  - platform: template
    name: "Mic gain"
    id: mic_gain_control
    icon: mdi:microphone
    entity_category: config
    min_value: 12
    max_value: 24
    step: 3
    unit_of_measurement: "dB"
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 21
    set_action:
      - lambda: |-
          uint8_t reg_value = 0x00;

          switch ((int)x) {
            case 12: reg_value = 0x44; break;
            case 15: reg_value = 0x55; break;
            case 18: reg_value = 0x66; break;
            case 21: reg_value = 0x77; break;
            case 24: reg_value = 0x88; break;
            default:
              ESP_LOGW("es8388", "Invalid mic_gain value");
              return;
          }

          if (!id(es8388_registers).write_byte(0x09, reg_value)) {
            ESP_LOGW("es8388", "Mic gain setting failed");
          } else {
            ESP_LOGI("es8388", "Mic gain: %.0f dB", x);
          }                
                
switch:
  - platform: template
    name: "Mic ALC"
    id: mic_alc
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    turn_on_action:
      - lambda: |-
          if (!id(es8388_registers).write_byte(0x12, 0xE2)) {
            ESP_LOGW("es8388", "Turning ALC on failed");
          }
    turn_off_action:
      - lambda: |-
          if (!id(es8388_registers).write_byte(0x12, 0x22)) {
            ESP_LOGW("es8388", "Turning ALC off failed");
          }
  - platform: template
    name: "Mic mute"
    id: mic_mute
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - microphone.mute:
      - micro_wake_word.stop:
      - output.turn_on: status_led
      - delay: 100ms
      - output.turn_off: status_led
    turn_off_action:
      - microphone.unmute:
      - micro_wake_word.start:
      - output.turn_on: status_led
      - delay: 100ms
      - output.turn_off: status_led
      - delay: 100ms
      - output.turn_on: status_led
      - delay: 100ms
      - output.turn_off: status_led

binary_sensor:
  - platform: gpio
    pin:
      number: 12
      inverted: true
    name: "K1"
    on_click:
      - if:
          condition:
            not:
              voice_assistant.is_running
          then:
            - voice_assistant.start:

  - platform: gpio
    pin:
      number: 11
      inverted: true
    name: "K2"
    on_click:
      then:
        - switch.toggle: mic_mute

  - platform: gpio
    pin:
      number: 13
      inverted: true
    name: "K3"
    on_click:
      then:
        - voice_assistant.stop:
#        - media_player.stop:
#            id: voice_media_player
        - output.turn_off: status_led          